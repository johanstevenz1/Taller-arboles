<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title></title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/css/styles.css">
  <script type="module" src="/static/js/main.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="" data-label="brand"><span class="brand-mark" aria-hidden="true">⌘</span><span data-text="brand"></span><span class="brand-dot"></span></a>
    <div class="workspace"><span class="workspace-icon" aria-hidden="true">▦</span><div><strong data-text="workspace"></strong><small data-text="workspaceCaption"></small></div><span aria-hidden="true">⌄</span></div>
    <p class="nav-label" data-text="navigation"></p>
    <nav><a class="nav-item active" href="#overview"><span aria-hidden="true">◈</span><span data-text="navInventory"></span><span class="nav-count" id="nav-count">0</span></a><a class="nav-item" href="#traversals"><span aria-hidden="true">⑂</span><span data-text="navTraversals"></span></a><a class="nav-item" href="#guide"><span aria-hidden="true">ⓘ</span><span data-text="navGuide"></span></a></nav>
    <div class="sidebar-note"><span class="note-symbol" aria-hidden="true">↗</span><strong data-text="sidebarTitle"></strong><p data-text="sidebarBody"></p><span class="small-tag" data-text="sidebarTag"></span></div>
    <div class="sidebar-footer"><span class="avatar" aria-hidden="true">A</span><div><strong data-text="footerTitle"></strong><small data-text="footerCaption"></small></div><span class="online-dot"></span></div>
  </aside>
  <div class="page">
    <header class="topbar"><div class="breadcrumb"><span data-text="workspace"></span><span aria-hidden="true">/</span><strong data-text="navInventory"></strong></div><span class="environment" data-text="environment"></span></header>
    <main id="overview">
      <div class="page-heading"><div><div class="eyebrow" data-text="eyebrow"></div><h1 data-text="heading"></h1><p data-text="subtitle"></p></div><button class="button secondary" id="example-button"><span aria-hidden="true">↻</span> <span data-text="loadExample"></span></button></div>
      <div class="notice" role="status" id="notice" hidden></div>
      <section class="stats-grid" data-label="statsTitle">
        <article class="stat-card"><div><span data-text="products"></span><span class="stat-icon" aria-hidden="true">▦</span></div><strong id="stat-size">0</strong><small data-text="productsHint"></small></article>
        <article class="stat-card"><div><span data-text="height"></span><span class="stat-icon" aria-hidden="true">⑂</span></div><strong id="stat-height">−1</strong><small data-text="heightHint"></small></article>
        <article class="stat-card"><div><span data-text="leaves"></span><span class="stat-icon" aria-hidden="true">◇</span></div><strong id="stat-leaves">0</strong><small data-text="leavesHint"></small></article>
        <article class="stat-card"><div><span data-text="units"></span><span class="stat-icon" aria-hidden="true">≋</span></div><strong id="stat-quantity">0</strong><small data-text="unitsHint"></small></article>
      </section>
      <div class="inventory-grid">
        <section class="panel operations"><div class="panel-heading"><div><h2 data-text="manageTitle"></h2><p data-text="manageSubtitle"></p></div><span class="heading-icon" aria-hidden="true">＋</span></div>
          <div class="tab-list" role="tablist" data-label="operations"><button class="tab active" role="tab" id="add-tab" aria-controls="add-panel" aria-selected="true" data-mode="add" data-text="add"></button><button class="tab" role="tab" id="search-tab" aria-controls="search-panel" aria-selected="false" data-mode="search" data-text="search"></button><button class="tab" role="tab" id="delete-tab" aria-controls="delete-panel" aria-selected="false" data-mode="delete" data-text="remove"></button></div>
          <form id="add-panel" role="tabpanel" aria-labelledby="add-tab">
            <label for="product-sku" data-text="sku"></label><input id="product-sku" name="sku" type="number" min="1" max="99999" required data-placeholder="skuPlaceholder"><small class="field-help" data-text="skuHelp"></small>
            <label for="product-name" data-text="productName"></label><input id="product-name" name="name" maxlength="60" required data-placeholder="namePlaceholder">
            <label for="product-quantity" data-text="quantity"></label><input id="product-quantity" name="quantity" type="number" min="0" max="99999" value="1" required>
            <button class="button primary wide" type="submit"><span aria-hidden="true">＋</span> <span data-text="addProduct"></span></button>
            <p class="form-note" data-text="insertHint"></p>
          </form>
          <form id="search-panel" role="tabpanel" aria-labelledby="search-tab" hidden><label for="search-query" data-text="searchLabel"></label><input id="search-query" maxlength="60" required data-placeholder="searchPlaceholder"><small class="field-help" data-text="searchHelp"></small><button class="button primary wide" type="submit" data-text="searchProduct"></button><div id="search-results" class="search-results" aria-live="polite"></div></form>
          <form id="delete-panel" role="tabpanel" aria-labelledby="delete-tab" hidden><label for="delete-sku" data-text="sku"></label><input id="delete-sku" type="number" min="1" max="99999" required data-placeholder="deletePlaceholder"><p class="delete-note" data-text="deleteHint"></p><button class="button danger wide" type="submit" data-text="deleteProduct"></button></form>
        </section>
        <section class="panel tree-panel"><div class="panel-heading"><div><div class="title-line"><h2 data-text="treeTitle"></h2><span class="status-pill" id="balance-label" data-text="balanced"></span></div><p data-text="treeSubtitle"></p></div><button id="fit-button" class="icon-button" data-label="fitView" data-title="fitView">⛶</button></div>
          <div class="tree-toolbar"><span class="tree-type" data-text="treeType"></span><div class="legend"><span><i class="legend-root"></i><span data-text="root"></span></span><span><i class="legend-node"></i><span data-text="node"></span></span><span><i class="legend-active"></i><span data-text="selected"></span></span></div></div>
          <div id="tree-container" class="tree-container"><div id="empty-state" class="empty-state"><span aria-hidden="true">⑂</span><h3 data-text="emptyTitle"></h3><p data-text="emptyBody"></p></div><svg id="tree-svg" role="group" data-label="treeGraphic"></svg></div>
          <div class="tree-footer"><span><i class="online-dot"></i><span data-text="liveUpdates"></span></span><span id="tree-detail" data-text="selectHint"></span></div>
        </section>
      </div>
      <section class="panel traversal-panel" id="traversals"><div class="panel-heading"><div><h2 data-text="traversalTitle"></h2><p data-text="traversalSubtitle"></p></div><span class="complexity-tag">O(n)</span></div><div class="traversal-controls"><div class="traversal-options"><button class="traversal-option active" data-order="inorder" data-text="inorder" aria-pressed="true"></button><button class="traversal-option" data-order="preorder" data-text="preorder" aria-pressed="false"></button><button class="traversal-option" data-order="postorder" data-text="postorder" aria-pressed="false"></button><button class="traversal-option" data-order="level-order" data-text="levelOrder" aria-pressed="false"></button></div><button id="play-button" class="button primary"><span aria-hidden="true">▷</span> <span data-text="play"></span></button></div><div class="traversal-description"><span id="traversal-description"></span><span id="traversal-progress" aria-live="polite"></span></div><div id="traversal-results" class="traversal-results" aria-live="polite"></div></section>
      <section class="guide-strip" id="guide"><div class="guide-icon" aria-hidden="true">✳</div><div><strong data-text="guideTitle"></strong><p data-text="guideBody"></p></div><span class="guide-badge">O(log n)</span></section>
      <footer class="page-footer"><span data-text="pageFooter"></span><span data-text="sessionNote"></span></footer>
    </main>
  </div>
  <dialog id="example-dialog" aria-labelledby="example-dialog-title"><h2 id="example-dialog-title" data-text="exampleDialogTitle"></h2><p data-text="exampleConfirm"></p><div class="dialog-actions"><button class="button secondary" id="cancel-example" data-text="cancel" autofocus></button><button class="button primary" id="confirm-example" data-text="replace"></button></div></dialog>
</body>
</html>
